<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="30%" style="stop-color:#16213e"/>
      <stop offset="60%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8001A;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C8001A;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="800" fill="url(#bg)"/>
  <!-- Subtle fashion runway lines -->
  <line x1="960" y1="0" x2="960" y2="800" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  <line x1="480" y1="0" x2="480" y2="800" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="1440" y1="0" x2="1440" y2="800" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <!-- Red accent glow -->
  <ellipse cx="300" cy="400" rx="200" ry="400" fill="url(#accent)"/>
  <!-- Fabric texture dots -->
  <circle cx="100" cy="100" r="1" fill="rgba(255,255,255,0.05)"/>
  <circle cx="200" cy="250" r="1.5" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1700" cy="150" r="1" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1500" cy="600" r="2" fill="rgba(255,255,255,0.03)"/>
  <circle cx="800" cy="700" r="1.5" fill="rgba(255,255,255,0.04)"/>
  <!-- Diagonal fashion lines -->
  <line x1="0" y1="600" x2="400" y2="0" stroke="rgba(200,0,26,0.08)" stroke-width="1"/>
  <line x1="1520" y1="800" x2="1920" y2="200" stroke="rgba(200,0,26,0.06)" stroke-width="1"/>
</svg>
