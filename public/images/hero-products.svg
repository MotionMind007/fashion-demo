<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F3EF"/>
      <stop offset="50%" style="stop-color:#EAE7E1"/>
      <stop offset="100%" style="stop-color:#E2DFD9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8001A;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#C8001A;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <!-- Fashion grid pattern -->
  <rect x="0" y="0" width="1920" height="600" fill="url(#accent)"/>
  <!-- Subtle grid -->
  <line x1="320" y1="0" x2="320" y2="600" stroke="rgba(10,10,10,0.03)" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="600" stroke="rgba(10,10,10,0.03)" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="600" stroke="rgba(10,10,10,0.03)" stroke-width="1"/>
  <line x1="1280" y1="0" x2="1280" y2="600" stroke="rgba(10,10,10,0.03)" stroke-width="1"/>
  <line x1="1600" y1="0" x2="1600" y2="600" stroke="rgba(10,10,10,0.03)" stroke-width="1"/>
  <line x1="0" y1="150" x2="1920" y2="150" stroke="rgba(10,10,10,0.02)" stroke-width="1"/>
  <line x1="0" y1="300" x2="1920" y2="300" stroke="rgba(10,10,10,0.02)" stroke-width="1"/>
  <line x1="0" y1="450" x2="1920" y2="450" stroke="rgba(10,10,10,0.02)" stroke-width="1"/>
  <!-- Decorative circles -->
  <circle cx="1700" cy="100" r="80" fill="none" stroke="rgba(200,0,26,0.05)" stroke-width="1"/>
  <circle cx="200" cy="500" r="120" fill="none" stroke="rgba(10,10,10,0.03)" stroke-width="1"/>
</svg>
