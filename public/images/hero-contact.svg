<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F3EF"/>
      <stop offset="100%" style="stop-color:#EAE7E1"/>
    </linearGradient>
    <linearGradient id="redglow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8001A;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#C8001A;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="400" fill="url(#redglow)"/>
  <!-- Fabric weave pattern -->
  <line x1="50" y1="0" x2="50" y2="1000" stroke="rgba(10,10,10,0.02)" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="1000" stroke="rgba(10,10,10,0.02)" stroke-width="1"/>
  <line x1="250" y1="0" x2="250" y2="1000" stroke="rgba(10,10,10,0.02)" stroke-width="1"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="rgba(10,10,10,0.015)" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="rgba(10,10,10,0.015)" stroke-width="1"/>
  <line x1="0" y1="600" x2="800" y2="600" stroke="rgba(10,10,10,0.015)" stroke-width="1"/>
</svg>
